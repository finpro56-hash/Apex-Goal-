<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="3" />

  <!-- Outer Ring Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#27272a" stroke-width="24" stroke-linecap="round" />

  <!-- Completed Progress Ring Arc (approx 75%) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#emeraldGrad)" stroke-width="24" stroke-linecap="round"
          stroke-dasharray="1005.3" stroke-dashoffset="250"
          transform="rotate(-90 256 256)" filter="url(#glow)" />

  <!-- Inner Milestone Geometric Node -->
  <circle cx="256" cy="96" r="16" fill="#34d399" />
  
  <!-- Central Stylized Apex Summit / Check Arrow -->
  <path d="M190 262 L236 308 L328 206" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Subtle Milestone tick dots -->
  <circle cx="416" cy="256" r="10" fill="#10b981" />
  <circle cx="256" cy="416" r="10" fill="#10b981" />
  <circle cx="96" cy="256" r="8" fill="#52525b" />
</svg>
